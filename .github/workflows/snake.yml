name: Profile cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # Midnight palette shared by every card
  CARD_COLORS: bg_color=0f172a&title_color=70a5fd&icon_color=a78bfa&text_color=cbd5e1&ring_color=7c3aed&hide_border=true&border_radius=12

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare output folder
        run: mkdir -p dist

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&${{ env.CARD_COLORS }}
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.CARD_COLORS }}
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Featured repo cards
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=policy-synapse&description_lines_count=3&show_owner=false&${{ env.CARD_COLORS }}
          path: dist/pin-policy-synapse.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=hephaestus-ledger&description_lines_count=3&show_owner=false&${{ env.CARD_COLORS }}
          path: dist/pin-hephaestus-ledger.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=aegis-nexus&description_lines_count=3&show_owner=false&${{ env.CARD_COLORS }}
          path: dist/pin-aegis-nexus.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=chaos-witness&description_lines_count=3&show_owner=false&${{ env.CARD_COLORS }}
          path: dist/pin-chaos-witness.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#4f46e5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#70a5fd&color_dots=#161b22,#1e3a8a,#3b5bdb,#7c3aed,#a78bfa

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
