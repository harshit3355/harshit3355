<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="vpa-recommender-oom-budget: Set an OOM-kill budget; it sizes each container's memory to meet it, with one margin calibrated on the whole fleet's history. No memory savings claimed: within 2–4% of VPA and KRR defaults."><title>vpa-recommender-oom-budget: Set an OOM-kill budget; it sizes each container's memory to meet it, with one margin calibrated on the whole fleet's history. No memory savings claimed: within 2–4% of VPA and KRR defaults.</title><style>
text{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace}
.up{opacity:0;animation:up .7s ease-out forwards}
