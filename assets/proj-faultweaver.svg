<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="faultweaver: An automated fix runs only when independent telemetry backs the root cause; otherwise it probes or escalates. Unsafe automated actions · 240 incidents · lower is better: Evidence gate + probes 11, Same agent, no gate 29"><title>faultweaver: An automated fix runs only when independent telemetry backs the root cause; otherwise it probes or escalates. Unsafe automated actions · 240 incidents · lower is better: Evidence gate + probes 11, Same agent, no gate 29</title><style>
