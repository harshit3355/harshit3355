<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="rollouts-plugin-metric-sequential: Aborts a canary when Prometheus error counts show a real regression, with a sequential test that stays valid however often Argo checks it. A 2× error regression is caught in about 7 intervals."><title>rollouts-plugin-metric-sequential: Aborts a canary when Prometheus error counts show a real regression, with a sequential test that stays valid however often Argo checks it. A 2× error regression is caught in about 7 intervals.</title><style>
text{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace}
.up{opacity:0;animation:up .7s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.up,.grow,.type,.blink,.cursor,.node,.pulse{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}
</style><defs><linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#131c3a"/></linearGradient></defs><rect x=".5" y=".5" width="1199" height="339" rx="22" fill="url(#cardbg)" stroke="#22304f"/><rect x="48.0" y="40" width="291" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".45"/><text x="61.0" y="58.3" font-size="12" fill="#a78bfa" font-weight="600" text-anchor="start" letter-spacing="1.2">ARGO ROLLOUTS PLUGIN · GO · v0.1.0</text><text x="48.0" y="112.0" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start" class="mono" >rollouts-plugin-metric-sequential</text><text x="48.0" y="156.0" font-size="18" fill="#cbd5e1" font-weight="400" text-anchor="start" >Aborts a canary when Prometheus error counts show</text><text x="48.0" y="184.0" font-size="18" fill="#cbd5e1" font-weight="400" text-anchor="start" >a real regression, with a sequential test that</text><text x="48.0" y="212.0" font-size="18" fill="#cbd5e1" font-weight="400" text-anchor="start" >stays valid however often Argo checks it.</text><rect x="48.0" y="266" width="276" height="30" rx="15.0" fill="#70a5fd" fill-opacity=".12" stroke="#70a5fd" stroke-opacity=".45"/><text x="61.0" y="285.7" font-size="13" fill="#70a5fd" font-weight="600" text-anchor="start" letter-spacing="0">kind e2e with Argo Rollouts v1.10.2</text><rect x="334.2" y="266" width="205" height="30" rx="15.0" fill="#70a5fd" fill-opacity=".12" stroke="#70a5fd" stroke-opacity=".45"/><text x="347.2" y="285.7" font-size="13" fill="#70a5fd" font-weight="600" text-anchor="start" letter-spacing="0">SHA-256 + SLSA provenance</text><text x="652.0" y="66.0" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="start" letter-spacing="1">WORST FALSE-ROLLBACK RATE · LOWER IS BETTER</text><text x="652.0" y="108.0" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start" >This plugin</text><text x="1152.0" y="108.0" font-size="15" fill="#34d399" font-weight="700" text-anchor="end" >1.7%</text><rect x="652" y="120" width="500" height="12" rx="6" fill="#18223f"/><rect class="grow" x="652" y="120" width="8.5" height="12" rx="6" fill="#34d399" style="animation-delay:0.35s"/><text x="652.0" y="170.0" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start" >z-test checked every interval</text><text x="1152.0" y="170.0" font-size="15" fill="#fbbf24" font-weight="700" text-anchor="end" >30.6%</text><rect x="652" y="182" width="500" height="12" rx="6" fill="#18223f"/><rect class="grow" x="652" y="182" width="153.0" height="12" rx="6" fill="#fbbf24" style="animation-delay:0.50s"/><text x="652.0" y="232.0" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start" >2× threshold rule</text><text x="1152.0" y="232.0" font-size="15" fill="#f87171" font-weight="700" text-anchor="end" >99.2%</text><rect x="652" y="244" width="500" height="12" rx="6" fill="#18223f"/><rect class="grow" x="652" y="244" width="496.0" height="12" rx="6" fill="#f87171" style="animation-delay:0.65s"/><text x="652.0" y="300.0" font-size="14" fill="#70a5fd" font-weight="400" text-anchor="start" >A 2× error regression is caught in about 7 intervals.</text></svg>