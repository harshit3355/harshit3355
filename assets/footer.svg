<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Thanks for stopping by"><title>Thanks for stopping by</title><style>
text{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace}
.up{opacity:0;animation:up .7s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.up,.grow,.type,.blink,.cursor,.node,.pulse{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}
</style><defs><linearGradient id="fw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0b1120"/></linearGradient><clipPath id="ff"><rect width="1200" height="170" rx="24"/></clipPath></defs><g clip-path="url(#ff)"><path d="M0 104 C200 64 400 144 600 104 S1000 64 1200 104 V170 H0Z" fill="url(#fw)" opacity=".9"/><path d="M0 128 C250 98 450 168 700 128 S1050 98 1200 134 V170 H0Z" fill="#7c3aed" opacity=".35"/></g><text x="600.0" y="56" font-size="16" text-anchor="middle" class="mono up"><tspan fill="#34d399">harshit@prod:~$ </tspan><tspan fill="#e2e8f0">exit </tspan><tspan fill="#64748b"># thanks for stopping by</tspan></text></svg>