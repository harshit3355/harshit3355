<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Harshit Nagila: DevOps, Cloud, SRE, DevSecOps. Runs production AI infrastructure on Azure and AWS and builds Kubernetes tooling in the open."><title>Harshit Nagila: DevOps, Cloud, SRE, DevSecOps. Runs production AI infrastructure on Azure and AWS and builds Kubernetes tooling in the open.</title><style>
text{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace}
.up{opacity:0;animation:up .7s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.up,.grow,.type,.blink,.cursor,.node,.pulse{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}

.type{clip-path:inset(0 100% 0 0);animation:type .7s steps(26,end) forwards}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
.cursor{opacity:0;animation:cur 1s step-end 4.4s infinite}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
.node{animation:lit 4.5s linear infinite}
@keyframes lit{0%,22%,100%{stroke:#3b4f80;fill:#0b1120}4%,14%{stroke:#70a5fd;fill:#1e3a8a}}
.pulse{animation:travel 4.5s linear infinite}
@keyframes travel{from{transform:translateX(0)}to{transform:translateX(1008px)}}</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/>
<stop offset=".55" stop-color="#111a3a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".38"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#2563eb" stop-opacity=".32"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70a5fd" stop-opacity="0"/><stop offset="1" stop-color="#70a5fd"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#273352"/></pattern>
<clipPath id="frame"><rect width="1200" height="460" rx="24"/></clipPath>
<clipPath id="term"><rect x="650" y="50" width="486" height="312" rx="14"/></clipPath></defs><g clip-path="url(#frame)"><rect width="1200" height="460" fill="url(#bg)"/><rect width="1200" height="460" fill="url(#dots)" opacity=".55"/><circle cx="170" cy="30" r="380" fill="url(#g1)"/><circle cx="1090" cy="480" r="360" fill="url(#g2)"/></g><rect x=".5" y=".5" width="1199" height="459" rx="24" fill="none" stroke="#2a3a63"/><g class="up"><rect x="64" y="58" width="348" height="34" rx="17" fill="#111c38" stroke="#2a3a63"/><circle class="blink" cx="84" cy="75" r="5" fill="#34d399"/><text x="98.0" y="80.0" font-size="14" fill="#cbd5e1" font-weight="600" text-anchor="start" >Production · Azure + AWS · AI platforms</text></g><text x="64.0" y="166.0" font-size="64" fill="url(#name)" font-weight="800" text-anchor="start" class="up" letter-spacing="-1.5" style="animation-delay:0.10s">Harshit Nagila</text><text x="64.0" y="208.0" font-size="20" fill="#70a5fd" font-weight="600" text-anchor="start" class="up mono" style="animation-delay:0.20s">DevOps · Cloud · SRE · DevSecOps</text><text x="64.0" y="252.0" font-size="18" fill="#cbd5e1" font-weight="400" text-anchor="start" class="up" style="animation-delay:0.30s">I run production AI infrastructure on Azure and AWS,</text><text x="64.0" y="279.0" font-size="18" fill="#cbd5e1" font-weight="400" text-anchor="start" class="up" style="animation-delay:0.35s">and build Kubernetes tooling in the open.</text><g class="up" style="animation-delay:0.45s"><rect x="64.0" y="308" width="172" height="30" rx="15.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".45"/><text x="77.0" y="328.0" font-size="14" fill="#a78bfa" font-weight="600" text-anchor="start" letter-spacing="0">3 yrs in production</text><rect x="246.3" y="308" width="149" height="30" rx="15.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".45"/><text x="259.3" y="328.0" font-size="14" fill="#a78bfa" font-weight="600" text-anchor="start" letter-spacing="0">OpenAI + Bedrock</text><rect x="405.5" y="308" width="142" height="30" rx="15.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".45"/><text x="418.5" y="328.0" font-size="14" fill="#a78bfa" font-weight="600" text-anchor="start" letter-spacing="0">Terraform · K8s</text></g><g class="up" style="animation-delay:0.15s"><g clip-path="url(#term)"><rect x="650" y="50" width="486" height="312" fill="#080d1c" fill-opacity=".92"/><rect x="650" y="50" width="486" height="36" fill="#121b33"/></g><rect x="650.5" y="50.5" width="485" height="311" rx="14" fill="none" stroke="#2a3a63"/><circle cx="672" cy="68" r="6" fill="#f87171"/><circle cx="692" cy="68" r="6" fill="#fbbf24"/><circle cx="712" cy="68" r="6" fill="#34d399"/><text x="893.0" y="73.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle" class="mono" >harshit@prod: ~</text></g><text x="672" y="122" font-size="15" class="mono type" style="animation-delay:0.60s"><tspan fill="#34d399">$ </tspan><tspan fill="#e2e8f0">whoami</tspan></text><text x="672.0" y="152.0" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start" class="mono up" style="animation-delay:1.35s">harshit · devops / sre · 3 yrs in production</text><text x="672" y="182" font-size="15" class="mono type" style="animation-delay:1.75s"><tspan fill="#34d399">$ </tspan><tspan fill="#e2e8f0">terraform plan</tspan></text><text x="672.0" y="212.0" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start" class="mono up" style="animation-delay:2.50s">No changes. 85+ resources match the config.</text><text x="672" y="242" font-size="15" class="mono type" style="animation-delay:2.90s"><tspan fill="#34d399">$ </tspan><tspan fill="#e2e8f0">kubectl argo rollouts status checkout</tspan></text><text x="672.0" y="272.0" font-size="15" fill="#34d399" font-weight="400" text-anchor="start" class="mono up" style="animation-delay:3.95s">✔ Healthy · canary promoted</text><text x="672" y="302" font-size="15" class="mono up" fill="#34d399" style="animation-delay:4.30s">$</text><rect class="cursor" x="690" y="288" width="9" height="18" fill="#70a5fd"/><line x1="96" y1="410" x2="1104" y2="410" stroke="#2a3a63" stroke-width="2"/><g class="pulse"><rect x="26" y="408.5" width="70" height="3" rx="1.5" fill="url(#trail)"/><circle cx="96" cy="410" r="5" fill="#c7d2fe"/></g><circle class="node" cx="96.0" cy="410" r="8" fill="#0b1120" stroke="#3b4f80" stroke-width="2" style="animation-delay:0.000s"/><text x="96.0" y="442.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" class="mono" >commit</text><circle class="node" cx="348.0" cy="410" r="8" fill="#0b1120" stroke="#3b4f80" stroke-width="2" style="animation-delay:1.125s"/><text x="348.0" y="442.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" class="mono" >build</text><circle class="node" cx="600.0" cy="410" r="8" fill="#0b1120" stroke="#3b4f80" stroke-width="2" style="animation-delay:2.250s"/><text x="600.0" y="442.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" class="mono" >scan</text><circle class="node" cx="852.0" cy="410" r="8" fill="#0b1120" stroke="#3b4f80" stroke-width="2" style="animation-delay:3.375s"/><text x="852.0" y="442.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" class="mono" >deploy</text><circle class="node" cx="1104.0" cy="410" r="8" fill="#0b1120" stroke="#3b4f80" stroke-width="2" style="animation-delay:4.500s"/><text x="1104.0" y="442.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" class="mono" >observe</text></svg>